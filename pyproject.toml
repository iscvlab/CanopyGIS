[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canopygis"
version = "1.8.1"
description = "Zero-shot planar individual tree crown delineation combining Meta SAM 3 with physics-guided shadow-crevice geodesic watershed and Euler==1 topological closure."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Napat (Tan) Phasundhiae" },
]
keywords = [
  "remote-sensing",
  "forestry",
  "tree-crown-delineation",
  "sam3",
  "watershed",
  "segmentation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.26.0",
  "opencv-python-headless>=4.9.0",
  "pillow>=10.2.0",
  "scipy>=1.12.0",
  "scikit-image>=0.22.0",
  "shapely>=2.0.1",
  "torch>=2.1.0",
  "transformers>=5.0.0rc1",
]

[project.urls]
Homepage = "https://github.com/napattan/CanopyGIS"
Repository = "https://github.com/napattan/CanopyGIS"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["canopygis_v18_eval", "canopy_v2"]
